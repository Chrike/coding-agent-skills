name: Repository tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate Skill suite
        run: python -B tests/validate_suite.py --strict
      - name: Check routing contract
        run: python -B tests/check_routing_contract.py
      - name: Run repository tests
        run: python -B -m unittest discover -s tests -p "test_*.py"
